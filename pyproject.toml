[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jabuka"
version = "0.1.0"
description = "Offline race navigation for an X35: receive-only B&G Fastnet + GPS data backbone, live routing and laylines"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pyfastnet==3.2.1",
    "pyserial==3.5",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "ruff==0.17.4",
]

# All console scripts are declared up front (plan 01-01) so the wave-2 plans
# never need to touch this file. Modules marked (01-0x) are created by that plan.
[project.scripts]
jabuka-ingest-fastnet = "jabuka.ingest.fastnet_main:main"
jabuka-core = "jabuka.core.main:main"
jabuka-replay = "jabuka.sim.pty_replay:main"
jabuka-replay-msgs = "jabuka.sim.msg_replay:main"     # (01-02)
fastnet-probe = "jabuka.tools.probe:main"             # (01-02)
jabuka-sim = "jabuka.sim.synth:main"                  # (01-03)
jabuka-fake-gpsd = "jabuka.sim.fake_gpsd:main"        # (01-03)
jabuka-logcheck = "jabuka.tools.logcheck:main"        # (01-04)

[tool.hatch.build.targets.wheel]
packages = ["src/jabuka"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
# starlette 1.10 testclient prefers httpx2 and warns when it falls back to httpx 0.28.1
# (starlette/testclient.py: StarletteDeprecationWarning, "Using `httpx` with ...").
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

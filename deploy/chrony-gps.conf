# Installed to /etc/chrony/conf.d/gps.conf by deploy/provision.sh.
# GPS time from gpsd via shared memory segment 0 (gpsd starts as root, so SHM 0 is usable).
# The VK-162 has no PPS: NMEA-only time wobbles ~100 ms, fine for the +/-1 s requirement.
# offset 0.2 is a starting value; tune it on the Pi with `chronyc sourcestats` once GPS is locked.
# provision.sh also sets `makestep 1 -1` in /etc/chrony/chrony.conf, so chrony may step the clock
# at any time (the Pi has no RTC and boots with a stale fake-hwclock time).
refclock SHM 0 refid GPS precision 1e-1 offset 0.2 delay 0.2

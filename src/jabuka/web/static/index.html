<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Jabuka — Barre</title>
  <link rel="stylesheet" href="/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/carte.css">
  <link rel="stylesheet" href="/reglages.css">
  <!-- vendored UMD globals (classic scripts run before the deferred module) -->
  <script src="/vendor/maplibre-gl.js"></script>
  <script src="/vendor/NoSleep.min.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body class="theme-day">
  <!-- full-screen map behind everything (map.js) -->
  <div id="map" aria-label="Carte" data-i18n-aria="aria.map"></div>

  <header id="topbar">
    <nav class="tabs" aria-label="Onglets" data-i18n-aria="aria.tabs">
      <button type="button" data-tab="barre" class="active" data-i18n="tab.barre">Barre</button>
      <button type="button" data-tab="carte" data-i18n="tab.carte">Carte</button>
      <button type="button" data-tab="reglages" data-i18n="tab.reglages">Réglages</button>
      <button type="button" data-tab="diag" data-i18n="tab.diag">Diag</button>
    </nav>
    <div id="badges" aria-live="polite"></div>
  </header>

  <div id="banner" role="status" hidden></div>

  <main>
    <section id="tab-barre" class="tab active" aria-label="Barre" data-i18n-aria="tab.barre">
      <!-- quick 002: the helm in a column (landscape: left third, map on the right two thirds;
           portrait: one top area, map below). Block 1 steer, block 2 route/tack (+ #route-band and
           ON RESTE from route.js), block 3 the rest. -->
      <div id="helm-col">
        <div id="helm-steer" class="helm-block">
          <div class="primary-box">
            <div id="primary-label" class="label">—</div>
            <div class="primary-line"><span id="primary">—</span><span id="primary-unit" class="unit"></span></div>
          </div>
          <div class="cell dev-cell"><span class="label" data-i18n="helm.deviation">Écart</span><span id="helm-deviation" class="num">—</span></div>
        </div>
        <div id="helm-route" class="helm-block">
          <div id="helm-countdown" class="countdown"></div>
        </div>
        <div id="helm-rest" class="helm-block">
          <div class="cell"><span class="label" data-i18n="helm.bspTarget">BSP / cible</span><span id="helm-speed" class="num">—</span></div>
          <div class="cell"><span class="label" data-i18n="helm.polar">Polaire</span><span id="helm-pct" class="num">— %</span></div>
          <div class="cell mark-cell wide"><span class="label" data-i18n="helm.mark">Marque</span><span id="helm-mark" class="num">—</span></div>
          <div class="cell"><span class="label" data-i18n="helm.distance">Distance</span><span id="helm-dtw" class="num">—</span></div>
          <div class="cell"><span class="label" data-i18n="helm.time">Temps</span><span id="helm-ttw" class="num">—</span></div>
          <div class="cell"><span class="label" data-i18n="helm.bearing">Relèvement</span><span id="helm-btw" class="num">—</span></div>
          <div class="cell other-cell"><span id="helm-other" class="num other"></span></div>
        </div>
      </div>
    </section>

    <section id="tab-carte" class="tab panel-side" aria-label="Carte" data-i18n-aria="tab.carte" hidden></section>
    <section id="tab-reglages" class="tab panel-full" aria-label="Réglages" data-i18n-aria="tab.reglages" hidden></section>
    <section id="tab-diag" class="tab panel-full" aria-label="Diagnostics" data-i18n-aria="aria.diag" hidden>
      <iframe id="diag-frame" title="Diagnostics" data-i18n-title="aria.diag"></iframe>
    </section>
  </main>

  <!-- lock mode (plan 02-05) -->
  <div id="lock-overlay" hidden></div>
  <!-- a stored lock covers the screen before any module loads (IN-08) -->
  <script src="/lock-early.js"></script>
</body>
</html>

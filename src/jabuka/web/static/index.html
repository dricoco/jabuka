<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Jabuka — Barre</title>
  <link rel="stylesheet" href="/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/carte.css">
  <link rel="stylesheet" href="/reglages.css">
  <!-- vendored UMD globals (classic scripts run before the deferred module) -->
  <script src="/vendor/maplibre-gl.js"></script>
  <script src="/vendor/NoSleep.min.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body class="theme-day">
  <!-- full-screen map behind everything (map.js) -->
  <div id="map" aria-label="Carte"></div>

  <header id="topbar">
    <nav class="tabs" aria-label="Onglets">
      <button type="button" data-tab="barre" class="active">Barre</button>
      <button type="button" data-tab="carte">Carte</button>
      <button type="button" data-tab="reglages">Réglages</button>
      <button type="button" data-tab="diag">Diag</button>
    </nav>
    <div id="badges" aria-live="polite"></div>
  </header>

  <div id="banner" role="status" hidden></div>

  <main>
    <section id="tab-barre" class="tab active" aria-label="Barre">
      <div id="helm-top" class="band">
        <div class="primary-box">
          <div id="primary-label" class="label">—</div>
          <div class="primary-line"><span id="primary">—</span><span id="primary-unit" class="unit"></span></div>
        </div>
        <div class="secondary">
          <div class="cell"><span class="label">Écart</span><span id="helm-deviation" class="num">—</span></div>
          <div class="cell"><span class="label">Vitesse / cible</span><span id="helm-speed" class="num">—</span></div>
          <div class="cell"><span class="label">Polaire</span><span id="helm-pct" class="num">— %</span></div>
        </div>
      </div>
      <div id="helm-bottom" class="band">
        <div id="helm-countdown" class="countdown"></div>
        <div class="secondary">
          <div class="cell"><span class="label">Marque</span><span id="helm-mark" class="num">—</span></div>
          <div class="cell"><span class="label">Distance</span><span id="helm-dtw" class="num">—</span></div>
          <div class="cell"><span class="label">Temps</span><span id="helm-ttw" class="num">—</span></div>
          <div class="cell"><span class="label">Relèvement</span><span id="helm-btw" class="num">—</span></div>
        </div>
        <div id="helm-other" class="other"></div>
      </div>
    </section>

    <section id="tab-carte" class="tab panel-side" aria-label="Carte" hidden></section>
    <section id="tab-reglages" class="tab panel-full" aria-label="Réglages" hidden></section>
    <section id="tab-diag" class="tab panel-full" aria-label="Diagnostics" hidden>
      <iframe id="diag-frame" title="Diagnostics"></iframe>
    </section>
  </main>

  <!-- lock mode (plan 02-05) -->
  <div id="lock-overlay" hidden></div>
</body>
</html>
